name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject .env Environment Secrets
        run: |
          if [ ! -f .env ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'AIzaSyPlaceholderKeyForBuildCheck12345' }}" > .env
          fi
          if [ ! -f .env.example ]; then
            echo "GEMINI_API_KEY=placeholder" > .env.example
          fi

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --info -x test

      - name: Collect Generated APKs
        run: |
          mkdir -p output_apks
          find . -type f -name "*.apk" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FamilyCare-APKs
          path: output_apks/*.apk
          retention-days: 7
